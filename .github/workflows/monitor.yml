name: FamilyTime External Monitor
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      notification_test:
        description: 'Send a clearly marked test notification without simulating an outage'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
concurrency:
  group: familytime-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: HTTP and certificate
        id: health
        continue-on-error: true
        run: python3 deploy/monitor.py
      - name: Incident lifecycle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEALTH: ${{ steps.health.outcome }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NOTIFICATION_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.notification_test }}
        run: python3 deploy/monitor_incident.py
      - name: Report failure
        if: steps.health.outcome != 'success'
        run: exit 1
